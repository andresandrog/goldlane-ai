<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gold Lane GOD MODE</title>

<!-- ✅ iOS ICON (FINAL FIX) -->
<link rel="apple-touch-icon" sizes="180x180" href="./icon-192.png?v=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gold Lane AI">

<style>
body{margin:0;background:#0a0c12;color:#f5c842;font-family:monospace}
.nav{display:flex;border-bottom:1px solid #333}
.nav button{flex:1;padding:10px;background:#111;border:none;color:#888}
.nav button.active{color:#f5c842;border-bottom:2px solid #f5c842}
.page{display:none;padding:15px}
.page.active{display:block}
.tag{display:inline-block;padding:6px;margin:4px;border:1px solid #f5c842;font-size:12px}
.box{border:1px solid #333;padding:10px;margin-top:10px;white-space:pre-line}
.btn{margin:6px;padding:8px;border:1px solid #f5c842}
h3{margin-top:0}
.warn{color:#ff4f5a}
.good{color:#3fffa2}
</style>
</head>

<body>

<div class="nav">
<button onclick="show('draft')" class="active">Draft AI</button>
<button onclick="show('macro')">Macro</button>
</div>

<div id="draft" class="page active">

<h3>Enemy Draft</h3>
<div id="enemy"></div>

<h3>Your Team</h3>
<div id="ally"></div>

<div class="btn" onclick="analyze()">Analyze Draft</div>

<div id="output" class="box">Select heroes...</div>

</div>

<div id="macro" class="page">
<h3>Game Plan</h3>
<div class="box">
EARLY:
Respect jungle pathing. Don’t coinflip lane.

MID:
Push → rotate → turtle. Stay with team.

LATE:
Position > damage.
If you die first → game is lost.
</div>
</div>

<script>

// ================= HERO DATABASE =================

const HERO_DB = {

// ASSASSINS
"Hayabusa":{dive:3},
"Lancelot":{dive:3},
"Gusion":{dive:2},
"Helcurt":{dive:3},
"Fanny":{dive:3},
"Nolan":{dive:3},
"Benedetta":{dive:2},
"Aamon":{dive:2},
"Joy":{dive:2},

// FIGHTERS
"Chou":{dive:2},
"Paquito":{dive:2},
"Arlott":{dive:2},
"Yu Zhong":{dive:2},
"Freya":{dive:2},
"Leomord":{dive:2},

// TANKS
"Akai":{tank:3},
"Gloo":{tank:3},
"Hylos":{tank:2},
"Fredrinn":{tank:3},
"Tigreal":{tank:2},
"Atlas":{tank:2},
"Khufra":{tank:2},
"Minotaur":{tank:2},
"Barats":{tank:3},

// SUPPORT
"Estes":{heal:3},
"Floryn":{heal:3},
"Angela":{heal:2},
"Rafaela":{heal:2},
"Mathilda":{heal:1},

// POKE
"Pharsa":{poke:3},
"Yve":{poke:3},
"Xavier":{poke:2},
"Novaria":{poke:3},
"Zhuxin":{poke:2},
"Valir":{poke:2},

// PICK
"Franco":{dive:1},
"Kaja":{dive:2},
"Saber":{dive:3}

};

// ================= TEAM ROLES =================

const TEAM_ROLES = {

"Hylos":"frontline",
"Akai":"frontline",
"Gloo":"frontline",
"Fredrinn":"frontline",
"Barats":"frontline",

"Atlas":"engage",
"Tigreal":"engage",
"Khufra":"engage",

"Franco":"pick",
"Kaja":"pick",

"Estes":"support",
"Angela":"support",
"Floryn":"support",
"Rafaela":"support",

"Mathilda":"utility"

};

// ================= MARKSMAN POOL =================

const MM = {

"Karrie":{tank:3, safe:1},
"Wanwan":{dive:3, skill:3},
"Melissa":{dive:3, safe:2},
"Claude":{scale:3, risky:1},
"Granger":{early:3},
"Brody":{early:3},
"Hanabi":{teamfight:3, safe:2},
"Irithel":{mobility:2},
"Bruno":{early:2},
"Beatrix":{early:3},
"Clint":{early:2},
"Moskov":{scale:2},
"Natan":{scale:2},
"Lesley":{poke:2},
"Popol":{safe:2},
"Kimmy":{mobility:2},
"Ixia":{teamfight:3},
"Miya":{scale:2},
"Layla":{scale:3, risky:3}

};

// ================= LANE THREATS =================

const LANE_THREATS = {
"Hayabusa":["Claude","Hanabi"],
"Chou":["Claude"],
"Gusion":["Hanabi"],
"Saber":["Layla","Hanabi"]
};

let enemySel=[], allySel=[];

// ================= BUILD UI =================

function build(id, arr){
let c=document.getElementById(id);
c.innerHTML="";

Object.keys(HERO_DB).forEach(h=>{
let el=document.createElement("div");
el.innerText=h;
el.className="tag";

el.onclick=()=>{
if(arr.includes(h)){
arr.splice(arr.indexOf(h),1);
el.style.background="";
}else{
arr.push(h);
el.style.background="#333";
}
};

c.appendChild(el);
});
}

build("enemy", enemySel);
build("ally", allySel);

// ================= ANALYSIS =================

function analyze(){

let threat={dive:0,tank:0,heal:0,poke:0};

enemySel.forEach(h=>{
let d=HERO_DB[h];
for(let k in d){ threat[k]+=d[k]; }
});

let frontline=false, support=false;

allySel.forEach(h=>{
let r=TEAM_ROLES[h];
if(r==="frontline") frontline=true;
if(r==="support") support=true;
});

let scores={};

for(let m in MM){
let s=0;

if(MM[m].tank) s+=threat.tank*MM[m].tank;
if(MM[m].dive) s+=threat.dive*MM[m].dive;

if(MM[m].scale && frontline) s+=4;
if(MM[m].early && threat.dive+threat.tank<4) s+=3;

if(!frontline && m==="Claude") s-=5;
if(threat.dive>=4 && m==="Hanabi") s-=4;

scores[m]=s;
}

let sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]);

let best=sorted[0][0];
let second=sorted[1][0];
let third=sorted[2][0];

// SPELL
let spell="Flicker";
if(threat.dive>=4) spell="Purify";

// BUILD
let build="Standard";
if(threat.tank>=4) build="Malefic / DHS";
if(threat.heal>=3) build="Sea Halberd";

// BAN
let ban="";
if(threat.heal>=3) ban="Ban Estes / Floryn";
else if(threat.dive>=4) ban="Ban Hayabusa / Fanny";
else ban="Ban comfort/meta";

// LANE WARNING
let laneWarn="";
enemySel.forEach(e=>{
if(LANE_THREATS[e]?.includes(best)){
laneWarn="⚠ BAD MATCHUP vs "+e;
}
});

// RISK
let risk="LOW";
if(threat.dive>=4 && !frontline) risk="HIGH";
else if(threat.dive>=3) risk="MED";

// WIN CONDITION
let win="";
if(best==="Granger"||best==="Brody") win="SNOWBALL FAST";
else if(best==="Claude") win="SCALE → TEAMFIGHT";
else if(best==="Karrie") win="FRONT TO BACK";
else win="PLAY SAFE → SCALE";

// PLAYSTYLE
let play="";
if(risk==="HIGH"){
play="PLAY ULTRA SAFE. Don't show alone.";
}else{
play="Play standard. Position well.";
}

// OUTPUT
let out=
`BEST PICK: ${best}
BACKUP: ${second}, ${third}

THREATS
Dive: ${threat.dive}
Tank: ${threat.tank}
Heal: ${threat.heal}
Poke: ${threat.poke}

TEAM
Frontline: ${frontline}
Support: ${support}

SPELL: ${spell}
BUILD: ${build}

BAN TIP:
${ban}

RISK LEVEL: ${risk}
${laneWarn}

WIN CONDITION:
${win}

PLAYSTYLE:
${play}`;

document.getElementById("output").innerText=out;
}

// ================= NAV =================

function show(p){
document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
document.getElementById(p).classList.add('active');
event.target.classList.add('active');
}

</script>

</body>
</html>
