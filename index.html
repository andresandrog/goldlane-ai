<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gold Lane AI</title>

<!-- PWA SETTINGS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gold Lane AI">
<meta name="theme-color" content="#0a0c12">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
body {
  margin:0;
  background:#0a0c12;
  color:#f5c842;
  font-family: monospace;
}

/* Retro grid */
body::before {
  content:'';
  position:fixed;
  width:100%;
  height:100%;
  background:
    repeating-linear-gradient(0deg, rgba(245,200,66,0.05) 0px, transparent 1px, transparent 20px),
    repeating-linear-gradient(90deg, rgba(245,200,66,0.05) 0px, transparent 1px, transparent 20px);
  pointer-events:none;
}

/* Container */
.container {
  padding:20px;
}

/* Header */
.title {
  text-align:center;
  font-size:26px;
  margin-bottom:10px;
}

.subtitle {
  text-align:center;
  font-size:12px;
  color:#888;
  margin-bottom:20px;
}

/* Buttons */
.btn {
  display:block;
  width:100%;
  margin:10px 0;
  padding:12px;
  background:#111520;
  border:1px solid #f5c842;
  color:#f5c842;
  text-align:center;
  cursor:pointer;
}

/* Output */
.output {
  margin-top:20px;
  padding:10px;
  background:#111520;
  border:1px solid #333;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">
  <div class="title">🎮 GOLD LANE AI</div>
  <div class="subtitle">Solo Queue Draft Assistant</div>

  <div class="btn" onclick="suggest('tank')">Enemy Tank Heavy</div>
  <div class="btn" onclick="suggest('assassin')">Enemy Dive / Assassin</div>
  <div class="btn" onclick="suggest('balanced')">Balanced Draft</div>

  <div id="result" class="output">Tap a scenario...</div>
</div>

<script>
function suggest(type) {
  let text = "";

  if (type === 'tank') {
    text = "Pick: Karrie / Wanwan\nReason: True damage shreds frontline.";
  }
  else if (type === 'assassin') {
    text = "Pick: Melissa / Wanwan\nReason: Anti-dive & self-peel.";
  }
  else {
    text = "Pick: Granger / Brody\nReason: Safe blind pick for solo queue.";
  }

  document.getElementById("result").innerText = text;
}

/* Service Worker */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
