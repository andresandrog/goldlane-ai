<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gold Lane AI S40</title>

<!-- ✅ ICON FIX (WORKS ON iOS) -->
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gold Lane AI">

<style>
body{
margin:0;
background:#0a0c12;
color:#f5c842;
font-family:system-ui;
}

/* NAV */
.nav{display:flex;background:#111;}
.nav button{
flex:1;padding:12px;border:none;
background:#111;color:#888;font-weight:bold;
}
.nav button.active{
color:#f5c842;border-bottom:2px solid #f5c842;
}

.container{padding:12px;}

.section-title{
margin:10px 0;color:#fff;font-weight:bold;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
}

.hero{
background:#161b2e;
border:1px solid #333;
border-radius:10px;
padding:6px;
text-align:center;
font-size:11px;
cursor:pointer;
}

.hero img{
width:100%;
border-radius:6px;
}

.hero.active{
border:2px solid #f5c842;
}

/* FILTER */
.filters{
display:flex;
overflow:auto;
gap:6px;
margin-bottom:10px;
}
.filters button{
padding:6px 10px;
background:#111;
border:1px solid #333;
color:#aaa;
border-radius:6px;
}
.filters button.active{
border-color:#f5c842;color:#f5c842;
}

/* SELECTED */
.selected{
display:flex;flex-wrap:wrap;gap:6px;
}
.pill{
padding:5px 10px;
border:1px solid #f5c842;
border-radius:20px;
font-size:12px;
}

/* OUTPUT */
.output{
margin-top:10px;
padding:12px;
border:1px solid #333;
background:#111;
white-space:pre-line;
}

.analyze{
margin-top:10px;
width:100%;
padding:12px;
background:#f5c842;
color:#000;
font-weight:bold;
border:none;
border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<div class="section-title">Enemy Picks</div>
<div id="enemy-picked" class="selected"></div>

<div class="filters" id="filters"></div>

<div id="grid" class="grid"></div>

<button class="analyze" onclick="analyze()">Analyze Draft</button>

<div id="result" class="output">Waiting for picks...</div>

</div>

<script>

// ================= HERO DATABASE (WITH REAL IDS) =================

const HERO_DB = {

Hanabi:1023,
Karrie:1024,
Claude:1016,
Melissa:1045,
Granger:1036,
Brody:1043,
Wanwan:1044,
Irithel:1017,
Kimmy:1028,
Beatrix:1040,

Hayabusa:1013,
Fanny:1012,
Lancelot:1026,
Ling:1035,

Gloo:1060,
Fredrinn:1070,
Barats:1049,
Akai:1010,

Estes:1019,
Floryn:1058,
Angela:1034,

Zhuxin:9999,
Yve:1039,
Pharsa:1025

};

// ================= ROLE FILTER =================

const ROLES = {
All:Object.keys(HERO_DB),
Marksman:["Hanabi","Karrie","Claude","Melissa","Granger","Brody","Wanwan","Irithel","Kimmy","Beatrix"],
Assassin:["Hayabusa","Fanny","Lancelot","Ling"],
Tank:["Gloo","Fredrinn","Barats","Akai"],
Support:["Estes","Floryn","Angela"],
Mage:["Yve","Pharsa"]
};

// ================= IMAGE FUNCTION =================

const getImg = h =>
`https://akmweb.youngjoygame.com/web/svnres/img/mlbb/homepage/${HERO_DB[h]}.png`;

// ================= STATE =================

let enemy=[];
let currentRole="All";

// ================= FILTER UI =================

const filters=document.getElementById("filters");

Object.keys(ROLES).forEach(r=>{
let b=document.createElement("button");
b.innerText=r;

b.onclick=()=>{
currentRole=r;
renderGrid();

document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
};

if(r==="All") b.classList.add("active");

filters.appendChild(b);
});

// ================= GRID =================

function renderGrid(){

const grid=document.getElementById("grid");
grid.innerHTML="";

ROLES[currentRole].forEach(h=>{

let div=document.createElement("div");
div.className="hero";

div.innerHTML=`
<img src="${getImg(h)}" onerror="this.src='https://via.placeholder.com/80'">
<div>${h}</div>
`;

div.onclick=()=>{

if(enemy.includes(h)){
enemy=enemy.filter(x=>x!==h);
div.classList.remove("active");
}
else{
enemy.push(h);
div.classList.add("active");
}

renderSelected();
};

grid.appendChild(div);

});
}

renderGrid();

// ================= SELECTED =================

function renderSelected(){
document.getElementById("enemy-picked").innerHTML=
enemy.map(h=>`<div class="pill">${h}</div>`).join("");
}

// ================= ANALYSIS (FIXED LOGIC) =================

function analyze(){

let dive=0,tank=0,heal=0,cc=0;

enemy.forEach(h=>{
if(ROLES.Assassin.includes(h)) dive+=2;
if(ROLES.Tank.includes(h)) tank+=2;
if(ROLES.Support.includes(h)) heal+=2;
if(ROLES.Mage.includes(h)) cc+=1;
});

let score={};

["Hanabi","Karrie","Melissa","Granger","Brody","Claude","Wanwan"].forEach(h=>{

let s=0;

if(h==="Karrie") s+=tank*2;
if(h==="Melissa") s+=dive*2;

if(h==="Hanabi"){
if(dive>=3) s+=6;
if(cc>=3) s+=4;
}

if(h==="Wanwan"){
if(dive>=3) s-=6;
if(cc>=3) s-=5;
}

if(h==="Claude" && tank===0) s-=3;

score[h]=s;
});

let best=Object.entries(score).sort((a,b)=>b[1]-a[1])[0][0];

document.getElementById("result").innerText=
`BEST PICK: ${best}

Dive: ${dive}
Tank: ${tank}
Heal: ${heal}
CC: ${cc}`;
}

</script>

</body>
</html>
