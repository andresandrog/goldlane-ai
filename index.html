<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gold Lane AI — GOD MODE</title>

<!-- ✅ iOS ICON FIXED -->
<link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png?v=10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gold Lane AI">

<style>

body{
margin:0;
background:#0a0c12;
color:#f5c842;
font-family:system-ui;
}

/* NAV */
.nav{
display:flex;
background:#111;
}
.nav button{
flex:1;
padding:12px;
border:none;
background:#111;
color:#888;
font-weight:bold;
}
.nav button.active{
color:#f5c842;
border-bottom:2px solid #f5c842;
}

/* LAYOUT */
.container{padding:12px}

.section-title{
margin:10px 0;
font-weight:bold;
color:#fff;
}

/* HERO GRID */
.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
}

.hero{
background:#161b2e;
border:1px solid #333;
border-radius:10px;
padding:6px;
text-align:center;
font-size:11px;
cursor:pointer;
transition:0.2s;
}

.hero img{
width:100%;
border-radius:6px;
}

.hero.active{
border:2px solid #f5c842;
background:#1e243d;
}

/* SELECTED ROW */
.selected{
display:flex;
gap:6px;
flex-wrap:wrap;
margin-bottom:10px;
}

.pill{
padding:6px 10px;
border:1px solid #f5c842;
border-radius:20px;
font-size:12px;
}

/* OUTPUT */
.output{
margin-top:10px;
padding:12px;
border:1px solid #333;
background:#111;
white-space:pre-line;
font-size:13px;
}

/* BUTTON */
.analyze{
margin-top:10px;
padding:12px;
width:100%;
background:#f5c842;
color:#000;
font-weight:bold;
border:none;
border-radius:8px;
}

</style>
</head>

<body>

<div class="nav">
<button class="active" onclick="tab('draft')">Draft</button>
<button onclick="tab('macro')">Macro</button>
</div>

<div id="draft" class="container">

<div class="section-title">Enemy Picks</div>
<div id="enemy-picked" class="selected"></div>

<div class="section-title">Your Team</div>
<div id="ally-picked" class="selected"></div>

<div class="section-title">Select Heroes</div>
<div id="hero-grid" class="grid"></div>

<button class="analyze" onclick="analyze()">Analyze Draft</button>

<div id="result" class="output">Tap heroes to start drafting...</div>

</div>

<div id="macro" class="container" style="display:none">
<div class="output">
EARLY:
Play safe. Track jungle.

MID:
Push → rotate → turtle.

LATE:
You are win condition.
Position = everything.
</div>
</div>

<script>

// ================= HERO DATA =================

const HEROES = [
"Hayabusa","Fanny","Lancelot","Gusion","Helcurt","Nolan",
"Gloo","Fredrinn","Barats","Akai","Hylos",
"Atlas","Tigreal","Khufra","Minotaur",
"Estes","Floryn","Angela",
"Pharsa","Yve","Novaria",
"Saber","Kaja","Franco"
];

// image base (you can swap later)
const IMG = "https://via.placeholder.com/80x80?text=";

// ================= LOGIC =================

const DATA={
"Hayabusa":{dive:3},"Fanny":{dive:3},"Lancelot":{dive:3},
"Gloo":{tank:3},"Fredrinn":{tank:3},
"Atlas":{cc:3},"Tigreal":{cc:3},
"Estes":{heal:3},"Floryn":{heal:3}
};

const MM={
"Karrie":{antiTank:3},
"Claude":{scale:3},
"Granger":{early:3},
"Brody":{early:3},
"Melissa":{antiDive:3},
"Hanabi":{teamfight:4,safe:3},
"Wanwan":{conditional:3}
};

// ================= STATE =================

let enemy=[], ally=[];

// ================= BUILD GRID =================

const grid=document.getElementById("hero-grid");

HEROES.forEach(h=>{
let div=document.createElement("div");
div.className="hero";
div.innerHTML=`<img src="${IMG+h}"><div>${h}</div>`;

div.onclick=()=>{
if(div.classList.contains("active")){
div.classList.remove("active");
enemy=enemy.filter(x=>x!==h);
ally=ally.filter(x=>x!==h);
}else{
div.classList.add("active");
enemy.push(h);
}
render();
};

grid.appendChild(div);
});

// ================= RENDER =================

function render(){

document.getElementById("enemy-picked").innerHTML=
enemy.map(h=>`<div class="pill">${h}</div>`).join("");

document.getElementById("ally-picked").innerHTML=
ally.map(h=>`<div class="pill">${h}</div>`).join("");

}

// ================= ANALYZE =================

function analyze(){

let dive=0,tank=0,heal=0,cc=0;

enemy.forEach(h=>{
let d=DATA[h];
if(!d) return;
if(d.dive) dive+=d.dive;
if(d.tank) tank+=d.tank;
if(d.heal) heal+=d.heal;
if(d.cc) cc+=d.cc;
});

// scoring
let scores={};

for(let m in MM){
let s=0;

if(MM[m].antiTank) s+=tank*2;
if(MM[m].antiDive) s+=dive*2;
if(MM[m].teamfight) s+=cc*2;

// hanabi boost
if(m==="Hanabi"){
if(dive>=3) s+=4;
if(cc>=3) s+=3;
}

// wanwan nerf
if(m==="Wanwan"){
if(dive>=3) s-=5;
if(cc>=4) s-=5;
}

scores[m]=s;
}

let best=Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];

document.getElementById("result").innerText=
`BEST PICK: ${best}

Dive:${dive} Tank:${tank} Heal:${heal} CC:${cc}

Recommended:
${best==="Hanabi"?"Safe teamfight carry":
best==="Karrie"?"Tank shred":
best==="Melissa"?"Anti dive":
"Standard"}`;

}

// ================= NAV =================

function tab(t){
document.getElementById("draft").style.display=t==="draft"?"block":"none";
document.getElementById("macro").style.display=t==="macro"?"block":"none";

document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
event.target.classList.add("active");
}

</script>

</body>
</html>
